spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  # 메일 발송 (Gmail SMTP). username/password는 여기 쓰지 않고 환경변수 SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD
  # (k8s Secret buyornot-db)로만 주입한다. 둘 다 없으면 NoopEmailSender가 동작해 서버는 정상 기동한다.
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

oauth:
  kakao:
    user-info-url: https://kapi.kakao.com/v2/user/me
  google:
    keys-url: https://www.googleapis.com/oauth2/v3/certs
    issuer: https://accounts.google.com
    web-client-id: ${GOOGLE_WEB_CLIENT_ID}
    ios-client-id: ${GOOGLE_IOS_CLIENT_ID}
    android-client-id: ${GOOGLE_ANDROID_CLIENT_ID}
  apple:
    keys-url: https://appleid.apple.com/auth/keys
    token-url: https://appleid.apple.com/auth/token
    issuer: https://appleid.apple.com
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    client-id: ${APPLE_CLIENT_ID}
    private-key: ${APPLE_PRIVATE_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

aws:
  region: ap-northeast-2
  s3:
    bucket: ${S3_BUCKET}
    key-prefix: feeds
    presign-exp-minutes: 10
    max-bytes: 20971520
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN}

firebase:
  enabled: true
  project-id: ${FIREBASE_PROJECT_ID:}
  service-account-key-path: ${FIREBASE_SERVICE_ACCOUNT_KEY_PATH:}

app:
  mail:
    from-address: buyornot22@gmail.com
    from-name: 살까말까
    web-base-url: https://dev-web.buy-or-not.com
    api-base-url: https://dev.buy-or-not.com
